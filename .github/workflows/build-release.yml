name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone App with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm `
            --name "YMusic-Desktop" `
            --windowed `
            --onedir `
            --collect-all "PyQt6" `
            --collect-all "PyQt6_WebEngine" `
            --collect-all "imageio_ffmpeg" `
            --collect-all "yt_dlp" `
            --collect-all "mutagen" `
            main.py

      - name: Archive Release Bundle (ZIP)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/YMusic-Desktop/*" -DestinationPath "dist/YMusic-Desktop-Windows-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Desktop-Windows-x64
          path: dist/YMusic-Desktop-Windows-x64.zip
          retention-days: 14

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YMusic-Desktop-Windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
